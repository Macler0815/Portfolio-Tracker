<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Portfolio Tracker</title>
    <meta property="og:title" content="Portfolio Tracker" />
    <meta property="og:description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">

    <script>
      // 1. Proactively clear service workers and caches on mobile
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) {
            caches.delete(k);
          }
        });
      }

      window.resetAndReload = function () {
        try {
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          }
        } catch (e) {}
        window.location.reload(true);
      };

      // 2. Catch all startup errors and unhandled promise rejections on iOS
      function showStartError(title, err) {
        var el = document.getElementById('debug-error');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#030712;color:#f87171;padding:24px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;z-index:999999;overflow:auto;line-height:1.5;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;';
          document.body.appendChild(el);
        }
        var msg = typeof err === 'string' ? err : (err && (err.message || err.stack)) || 'Unbekannter Fehler';
        el.innerHTML = '<div style="max-width:340px;width:100%;background:#111827;border:1px solid #374151;border-radius:18px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
          '<h2 style="color:#fff;font-size:16px;margin:0 0 10px;font-weight:bold;">' + title + '</h2>' +
          '<p style="color:#ef4444;font-size:12px;margin:0 0 16px;word-break:break-all;">' + msg + '</p>' +
          '<button onclick="window.resetAndReload()" style="width:100%;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Cache leeren & neu laden</button>' +
          '</div>';
      }

      window.addEventListener('error', function (e) {
        showStartError('Ladefehler aufgetreten', (e.message || String(e)));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showStartError('Modulfehler (Promise)', e.reason);
      });
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-green-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
