<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Portfolio Tracker</title>
    <meta property="og:title" content="Portfolio Tracker" />
    <meta property="og:description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-green-500/20">
    <div id="root"></div>
    <script>
      // Global error catcher for iPhone/mobile debugging (prevents silent white screen)
      window.addEventListener('error', function (e) {
        if (!document.getElementById('root')?.hasChildNodes()) {
          var el = document.getElementById('debug-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'debug-error';
            el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#030712;color:#f87171;padding:24px;font-family:system-ui,monospace;font-size:13px;z-index:999999;overflow:auto;line-height:1.5;';
            el.innerHTML = '<h2 style="color:#fff;font-size:16px;margin:0 0 12px;font-weight:bold;">Startfehler auf dem Gerät:</h2>';
            document.body.appendChild(el);
          }
          el.innerHTML += '<div style="background:#1f2937;padding:12px;border-radius:12px;margin-bottom:12px;word-break:break-all;">' +
            '<p style="color:#ef4444;font-weight:bold;margin:0 0 4px;">' + (e.message || 'Unbekannter Fehler') + '</p>' +
            '<p style="color:#9ca3af;font-size:11px;margin:0;">' + (e.filename || '') + ':' + (e.lineno || '') + '</p>' +
            '</div>' +
            '<button onclick="location.reload(true)" style="background:#16a34a;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;">Neu laden</button>';
        }
      });

      // Clear any outdated caches from previous versions
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k !== 'portfolio-tracker-v19') {
              caches.delete(k);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .then(function (reg) {
              reg.update().catch(function () {});
            })
            .catch(function () {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
