<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Portfolio Tracker</title>
    <meta property="og:title" content="Portfolio Tracker" />
    <meta property="og:description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-green-500/20">
    <script>
      window.addEventListener('error', function(e) {
        var r = document.getElementById('root');
        if (r && !r.hasChildNodes()) {
          r.innerHTML = '<div style="padding:24px;color:#ef4444;font-family:system-ui,-apple-system,sans-serif;background:#09090b;min-height:100vh;">' +
            '<h2 style="font-size:18px;margin-bottom:8px;">App-Startfehler</h2>' +
            '<p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">' + (e.message || 'Unbekannter Fehler') + '</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});});}window.location.reload(true);" style="background:#16a34a;color:#fff;border:none;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Cache bereinigen & Neu laden</button>' +
            '</div>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
