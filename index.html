<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Portfolio Tracker</title>
    <meta property="og:title" content="Portfolio Tracker" />
    <meta property="og:description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <script>
      // Early error listener to prevent silent white screen crashes on iOS Safari
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-overlay';
          el.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#0b0f19;color:#f87171;padding:24px;font-family:monospace;font-size:13px;overflow:auto;display:flex;flex-direction:column;gap:12px;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.innerHTML = '<div style="background:rgba(239,68,68,0.2);border:1px solid #ef4444;border-radius:8px;padding:16px;">' +
          '<h2 style="color:#ef4444;margin:0 0 8px 0;font-size:16px;font-weight:bold;">Laufzeitfehler beim App-Start</h2>' +
          '<div style="color:#fff;margin-bottom:8px;word-break:break-all;">' + (e.message || e.error || 'Unbekannter Fehler') + '</div>' +
          '<div style="color:#94a3b8;font-size:11px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</div>' +
          '<button onclick="localStorage.clear();sessionStorage.clear();if(window.indexedDB)indexedDB.deleteDatabase(\'portfolio-tracker\');if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(w){w.unregister();});});window.location.reload();" style="margin-top:16px;background:#ef4444;color:white;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;">Cache leeren & App zurücksetzen</button>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-overlay';
          el.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#0b0f19;color:#f87171;padding:24px;font-family:monospace;font-size:13px;overflow:auto;display:flex;flex-direction:column;gap:12px;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.innerHTML = '<div style="background:rgba(239,68,68,0.2);border:1px solid #ef4444;border-radius:8px;padding:16px;">' +
          '<h2 style="color:#ef4444;margin:0 0 8px 0;font-size:16px;font-weight:bold;">Unhandled Promise Rejection</h2>' +
          '<div style="color:#fff;margin-bottom:8px;word-break:break-all;">' + (e.reason ? (e.reason.message || e.reason) : 'Unbekannter Fehler') + '</div>' +
          '<button onclick="localStorage.clear();sessionStorage.clear();if(window.indexedDB)indexedDB.deleteDatabase(\'portfolio-tracker\');if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(w){w.unregister();});});window.location.reload();" style="margin-top:16px;background:#ef4444;color:white;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;">Cache leeren & App zurücksetzen</button>' +
          '</div>';
      });
    </script>
</head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-green-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });
      }

      // White-screen watchdog timer: If #root is still completely empty after 3.5s
      setTimeout(function() {
        var root = document.getElementById('root');
        var hasContent = root && root.children && root.children.length > 0 && root.innerHTML.trim().length > 0;
        if (!hasContent && !document.getElementById('debug-error-overlay')) {
          var box = document.createElement('div');
          box.id = 'watchdog-recovery';
          box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0a0a0b;color:#fff;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
          box.innerHTML = '<div style="max-width:340px;">' +
            '<div style="width:52px;height:52px;border-radius:26px;background:#1f2937;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">' +
            '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>' +
            '</div>' +
            '<h2 style="font-size:18px;font-weight:700;margin:0 0 8px;">App-Start verzögert</h2>' +
            '<p style="font-size:13px;color:#9ca3af;margin:0 0 20px;line-height:1.5;">Falls ein veralteter iPhone-Cache den Start blockiert, tippe auf den Button, um den Cache zu leeren und die App neu zu laden.</p>' +
            '<button id="btn-fix-cache" style="width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;">Cache leeren & App neu laden</button>' +
            '</div>';
          document.body.appendChild(box);
          var btn = document.getElementById('btn-fix-cache');
          if (btn) {
            btn.onclick = function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  names.forEach(function(n) { caches.delete(n); });
                });
              }
              localStorage.removeItem('portfolio_webauthn_cred_id');
              window.location.href = window.location.origin + window.location.pathname + '?nocache=' + Date.now();
            };
          }
        }
      }, 2500);
    </script>
  </body>
</html>
