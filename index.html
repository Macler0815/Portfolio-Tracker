<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Portfolio Tracker</title>
    <meta property="og:title" content="Portfolio Tracker" />
    <meta property="og:description" content="Track dein globales Aktien- und ETF-Portfolio" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-green-500/20">
    <div id="root"></div>
    <script>
      // 1. Explicitly unregister any active service worker to prevent stale module caching on mobile devices
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      // 2. Clear all browser cache storage
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) {
            caches.delete(k);
          }
        });
      }

      // 3. Catch all startup errors and unhandled promise rejections on iOS
      function showStartError(title, err) {
        var el = document.getElementById('debug-error');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#030712;color:#f87171;padding:24px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;z-index:999999;overflow:auto;line-height:1.5;box-sizing:border-box;';
          document.body.appendChild(el);
        }
        var msg = typeof err === 'string' ? err : (err && (err.message || err.stack)) || 'Unbekannter Fehler';
        el.innerHTML = '<h2 style="color:#fff;font-size:16px;margin:0 0 12px;font-weight:bold;">' + title + '</h2>' +
          '<div style="background:#1f2937;padding:12px;border-radius:12px;margin-bottom:12px;word-break:break-all;">' +
          '<p style="color:#ef4444;font-weight:bold;margin:0 0 4px;">' + msg + '</p>' +
          '</div>' +
          '<button onclick="location.reload(true)" style="background:#16a34a;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;">Neu laden</button>';
      }

      window.addEventListener('error', function (e) {
        showStartError('Skript-Fehler aufgetreten:', (e.message || String(e)) + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')');
      });
      window.addEventListener('unhandledrejection', function (e) {
        showStartError('Modul-Ladefehler (Promise Rejection):', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
